<title>Exam Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: lab-bench notebook. Graph-paper ground, top tab strip (bottom bar on phones), a timeline column plus a side column. Subjects wear resistor colour bands. */
:root{
  --bg:#EDF1F3; --paper:#F8FAFB; --ink:#12212C; --ink2:#4A5B67; --line:#CFD9DF; --grid:#DCE4E9;
  --accent:#D9482B; --accent-ink:#FFFFFF; --accent-soft:#F8E1DB;
  --ok:#2F7D4F; --warn:#9A6411; --bad:#B3321F;
  --ph-cover:#3F72B8; --ph-practice:#7C5BB0; --ph-exam:#C8412F; --ph-buffer:#4C9A5B;
  --c0:#8A5A3B; --c1:#C8412F; --c2:#E0832B; --c3:#C9A21C; --c4:#4C9A5B; --c5:#3F72B8; --c6:#7C5BB0; --c7:#7C8791; --c8:#2A9D9A; --c9:#C8559A;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1319; --paper:#111D25; --ink:#E3ECF1; --ink2:#93A5B1; --line:#26363F; --grid:#14232C;
  --accent:#FF8A5C; --accent-ink:#1A0D07; --accent-soft:#33201A;
  --ok:#6CC58B; --warn:#E3B25A; --bad:#FF7D68;
  --ph-cover:#6FA1E0; --ph-practice:#A98BDD; --ph-exam:#FF7D68; --ph-buffer:#6CC58B;
  --c0:#C08A67; --c1:#FF7D68; --c2:#F2A04E; --c3:#E3C44A; --c4:#6CC58B; --c5:#6FA1E0; --c6:#A98BDD; --c7:#9AA8B2; --c8:#4FC9C5; --c9:#E889C0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1319; --paper:#111D25; --ink:#E3ECF1; --ink2:#93A5B1; --line:#26363F; --grid:#14232C;
  --accent:#FF8A5C; --accent-ink:#1A0D07; --accent-soft:#33201A;
  --ok:#6CC58B; --warn:#E3B25A; --bad:#FF7D68;
  --ph-cover:#6FA1E0; --ph-practice:#A98BDD; --ph-exam:#FF7D68; --ph-buffer:#6CC58B;
  --c0:#C08A67; --c1:#FF7D68; --c2:#F2A04E; --c3:#E3C44A; --c4:#6CC58B; --c5:#6FA1E0; --c6:#A98BDD; --c7:#9AA8B2; --c8:#4FC9C5; --c9:#E889C0;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:.01em;text-wrap:balance;line-height:1.05}
h2{font-size:1.9rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar + nav */
.top{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font:800 1.6rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.bands{display:inline-flex;gap:3px;height:20px;align-items:stretch}
.bands i{display:block;width:5px;border-radius:1px}
.bands i:nth-child(1){background:var(--c0)} .bands i:nth-child(2){background:var(--c2)} .bands i:nth-child(3){background:var(--c5)} .bands i:nth-child(4){background:var(--c3);margin-left:5px}
.grow{flex:1}
.savestate{font:500 .75rem var(--font-mono);color:var(--ink2)}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink)}
nav.tabs a{padding:9px 16px;text-decoration:none;color:var(--ink2);font-weight:600;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;display:flex;align-items:center;gap:8px}
nav.tabs a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper);border-color:var(--ink)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--ink);border-bottom:0;justify-content:space-around;
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:column;gap:2px;padding:6px 8px;font-size:.72rem;border:0;margin:0;flex:1;align-items:center;min-width:0}
  nav.tabs a[aria-current="page"]{background:transparent;color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
}

/* panels + controls */
.panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:16px}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.btn{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:7px 14px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--font-mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 7px;border:1.5px solid var(--line);border-radius:3px;white-space:nowrap}
.chip.ph-cover{color:var(--ph-cover);border-color:var(--ph-cover)}
.chip.ph-practice{color:var(--ph-practice);border-color:var(--ph-practice)}
.chip.ph-exam{color:var(--ph-exam);border-color:var(--ph-exam)}
.chip.ph-buffer{color:var(--ph-buffer);border-color:var(--ph-buffer)}
.band{display:inline-block;width:10px;height:16px;border-radius:1px;vertical-align:-3px;margin-right:6px;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.in,select.in,textarea.in{background:var(--bg);border:1.5px solid var(--line);border-radius:3px;padding:7px 9px;color:var(--ink);width:100%;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{min-height:120px;resize:vertical;font-family:var(--font-body)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notice{border:1.5px solid var(--warn);background:var(--paper);padding:10px 14px;border-radius:3px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.info{border-color:var(--ph-cover)}
.notice.bad{border-color:var(--bad)}
.notice .grow{min-width:200px}

/* Today */
.hero{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 12px}
.daynum{font:800 clamp(3.2rem,11vw,5.4rem)/.85 var(--font-display);letter-spacing:.01em}
.daynum small{font-size:.35em;color:var(--ink2);letter-spacing:.05em;margin-left:8px}
.dayrail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(6px,1fr);gap:2px;margin:6px 0 0}
.dayrail i{height:14px;background:var(--line);display:block;border-radius:1px;position:relative}
.dayrail i.ph-cover{background:var(--ph-cover)} .dayrail i.ph-practice{background:var(--ph-practice)} .dayrail i.ph-exam{background:var(--ph-exam)} .dayrail i.ph-buffer{background:var(--ph-buffer)}
.dayrail i.past{opacity:.35}
.dayrail i.cur{outline:2px solid var(--ink);outline-offset:1px;opacity:1;z-index:1}
.dayrail i.ex::after{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:var(--bad)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:0 10px;padding:0 0 14px;position:relative}
.tl .t{font:600 .78rem/1.5 var(--font-mono);text-align:right;padding-top:12px;color:var(--ink2)}
.tl .rail{position:relative}
.tl .rail::before{content:"";position:absolute;left:8px;top:0;bottom:-14px;width:2px;background:var(--line)}
.tl li:last-child .rail::before{bottom:14px}
.tl .dot{position:absolute;left:3px;top:14px;width:12px;height:12px;border:2px solid var(--ink);background:var(--paper);border-radius:2px;z-index:1}
.tl .card{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;min-width:0}
.tl li.brk .card{background:transparent;border:1.5px dashed var(--line);padding:6px 12px}
.tl li.brk .dot{border-color:var(--line);border-radius:50%}
.tl li.done .card{opacity:.6}
.tl li.done .ttl{text-decoration:line-through;text-decoration-thickness:1px}
.tl li.out .card{border-style:dashed}
.tl .head{display:flex;gap:10px;align-items:flex-start}
.tl .ttl{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.tl .dur{font:600 .75rem var(--font-mono);color:var(--ink2);white-space:nowrap;padding-top:3px}
.tl .detail{margin-top:4px;color:var(--ink2);font-size:.9rem;overflow-wrap:anywhere}
.tl ul.sub{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.tl ul.sub li{display:grid;grid-template-columns:minmax(26px,max-content) minmax(0,1fr);gap:8px;padding:0;font-size:.88rem}
.tl ul.sub li .m{font:600 .75rem var(--font-mono);color:var(--accent);padding-top:2px}
.tl .acts{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.how{margin-top:8px;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.88rem}
.how ol{margin:4px 0 0;padding-left:18px}
.prog{height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent)}
.prog.ok b{background:var(--ok)}
@media (max-width:760px){.tl li{grid-template-columns:48px 14px minmax(0,1fr);gap:0 6px}.tl .t{font-size:.7rem}}

/* Plan */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cal button{background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:5px 4px 6px;cursor:pointer;text-align:left;min-width:0;display:flex;flex-direction:column;gap:3px}
.cal button:hover{border-color:var(--ink)}
.cal button.cur{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.cal .d{font:600 .7rem var(--font-mono);color:var(--ink2)}
.cal .n{font:800 1.15rem/1 var(--font-display)}
.cal .pb{height:4px;border-radius:1px;background:var(--line)}
.cal .ph-cover .pb{background:var(--ph-cover)} .cal .ph-practice .pb{background:var(--ph-practice)} .cal .ph-exam .pb{background:var(--ph-exam)} .cal .ph-buffer .pb{background:var(--ph-buffer)}
.cal .fl{font:600 .62rem var(--font-mono);color:var(--bad);min-height:.9em}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:560px}
table.t th{font:600 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.05em;text-align:left;color:var(--ink2);padding:6px 8px;border-bottom:1.5px solid var(--ink)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--accent-soft)}
.bar{display:flex;height:14px;background:var(--line);border-radius:1px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--lc);border-radius:1px}

/* forms */
.subj{border:1.5px solid var(--ink);background:var(--paper);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px}
.subj .hd{display:flex;gap:10px;align-items:center}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hours label{display:flex;flex-direction:column;gap:3px;font:600 .72rem var(--font-mono);color:var(--ink2);text-align:center}
.hours input{text-align:center;padding:6px 2px}
details.g{border:1.5px solid var(--line);border-radius:3px;background:var(--paper)}
details.g+details.g{margin-top:8px}
details.g summary{cursor:pointer;padding:10px 12px;font-weight:700}
details.g .bd{padding:0 12px 12px;color:var(--ink2)}
details.g ol{margin:6px 0 0;padding-left:20px}
.empty{padding:28px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:4px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.tl .card,.btn{transition:background .15s,opacity .15s}}
</style>
<div class="wrap" id="app"></div>
<style>
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;font-weight:600;opacity:0;pointer-events:none;z-index:40;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s,transform .2s}}
.ai-sub{border:1.5px solid var(--line);border-radius:3px;padding:12px;background:var(--bg)}
.ai-topics,.files{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ai-topics label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ai-topics label.dup{color:var(--ink2)}
.ai-topics input{margin-top:3px}
.files li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:3px;padding:4px 4px 4px 10px;overflow-wrap:anywhere}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{cursor:pointer;display:inline-flex;align-items:center}
.fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:35;transition:transform .12s,box-shadow .12s,filter .12s}
.fab:hover{filter:brightness(1.08);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (max-width:760px){.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px;width:48px;height:48px}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 var(--accent)}}
.ai-highlight{animation:ai-pulse 1.2s ease}
.chip.q-num{color:var(--ph-practice);border-color:var(--ph-practice)}
.chip.q-desc{color:var(--ph-cover);border-color:var(--ph-cover)}
</style>
<script>
/* ===== Engine: pure planning logic ===== */
const E=(function(){
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dowMon=s=>(parse(s).getDay()+6)%7;
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=s=>{const d=parse(s);return WD[dowMon(s)]+' '+d.getDate()+' '+MN[d.getMonth()]};
const shortDate=s=>{const d=parse(s);return d.getDate()+' '+MN[d.getMonth()]};
const tmin=t=>{const a=(t||'21:30').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)};
const fmtTime=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return ((h%12)||12)+':'+pad(mm)+' '+(h<12?'am':'pm')};
const RF={weak:1.5,okay:1,strong:.7}, WF={1:.8,2:1,3:1.3};
const BRK=['Drink water, stand up and stretch your neck and wrists.','Walk to a window and look at something far away.','Eat a light snack: fruit or nuts.','Take 20 slow breaths, then walk around the room.','Step outside or onto the balcony for fresh air.'];
const nq=n=>n+' question'+(n===1?'':'s');
const r5=x=>Math.max(5,Math.round(x/5)*5);

function layout(M,brk){
  if(M<45) return null;
  const big=M>=105,S0=big?10:5,LOG=big?10:5,SH=5,minR=big?20:10;
  const n=Math.max(1,Math.floor((M-S0-LOG-SH-minR)/(50+brk)));
  let L=50,free=M-S0-LOG-SH-minR-n*(L+brk);
  if(free<0){
    L=Math.floor((M-S0-LOG-SH-minR-n*brk)/n);
    if(L<20) return {S0,LOG,SH,n:1,L:Math.max(10,M-S0-LOG-SH-minR),R:minR,brk:0};
    free=M-S0-LOG-SH-minR-n*(L+brk);
  }
  const g=Math.min(10,Math.floor(free/n/5)*5);L+=g;free-=g*n;
  return {S0,LOG,SH,n,L,R:minR+free,brk};
}

function buildPlan(S){
  const st=S.settings,subs=S.subjects.filter(s=>s.name&&s.name.trim());
  const warnings=[];
  const none=m=>({days:[],warnings:[m],stats:{},empty:true,subs});
  if(!subs.length) return none('Add at least one subject in Setup to build a plan.');
  const ex=s=>s.examDate||st.examDate;
  if(!subs.every(ex)) return none('Set your first exam date in Setup.');
  const lastExam=subs.map(ex).sort().pop();
  const start=st.startDate,endDate=addDays(lastExam,-1),n=diffDays(start,endDate)+1;
  if(n<1) return none('Your start date is on or after the last exam. Change the dates in Setup.');
  const days=[];
  for(let i=0;i<n;i++){
    const date=addDays(start,i),dow=dowMon(date),m=Math.round((+st.hours[dow]||0)*60);
    days.push({i,date,dow,min:m,buffer:dow===st.bufferDay&&m>0,rows:[],out:[],exams:subs.filter(s=>ex(s)===date).map(s=>s.name),phase:m>0?(dow===st.bufferDay?'buffer':''):'rest',headline:[]});
  }
  const kc={};
  const mk=(day,kind,dur,title,o)=>{o=o||{};const k=day.date+'|'+kind;kc[k]=(kc[k]||0)+1;
    return Object.assign({id:day.date+'|'+kind+'|'+(o.ref||kc[k]),kind,dur,title},o)};

  /* tasks: assignments, lab records, projects */
  const sepBy={},shBy={},shLoad={},sepLoad={};let sepTotal=0;
  const modeOf=t=>t.mode==='separate'||t.mode==='shared'?t.mode:(t.type==='lab'?'separate':'shared');
  for(const t of S.tasks){
    const rem=Math.max(0,(+t.totalMin||0)-(S.taskDone[t.id]||0));if(!rem) continue;
    const mode=modeOf(t),cm=Math.max(10,Math.min(+t.chunkMin||60,mode==='shared'?90:180));
    const lens=[];for(let r=rem;r>0;r-=cm) lens.push(Math.min(cm,r));
    let endIdx=t.due?diffDays(start,t.due)-1:n-1;
    if(t.due&&t.due<=start){endIdx=0;warnings.push('"'+t.title+'" is due on or before the first plan day, so it is placed on day 1.')}

async function aiPrep(f){

  try{
    const bmp=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    if(!blob) throw 0;
    return {mime:'image/jpeg',b64:await readB64(blob),blob,name:f.name};
  }catch(e){
    if(/^image\/(jpeg|png|webp|heic|heif)$/.test(f.type)&&!(ai.provider==='claude'&&/hei[cf]/.test(f.type))) return {mime:f.type,b64:await readB64(f),blob:f,name:f.name};

  }
}

async function aiAskGemini(prompt,prep){

  const hasPdf=prep.some(p=>p.mime==='application/pdf');

  const call=async(m,withSchema)=>{
    const genCfg={temperature:.1,responseMimeType:'application/json'};
    if(withSchema) genCfg.responseSchema=schema;
    const body={contents:[{role:'user',parts}],generationConfig:genCfg};
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);
    try{
      const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':ai.key},body:JSON.stringify(body),signal:ac.signal});
      clearTimeout(tm);return res;
    }catch(e){clearTimeout(tm);throw ac.signal.aborted?codeErr('timeout'):codeErr('network')}
  };
  let r=await call(model,!hasPdf);
  if(!r.ok&&r.status>=500&&!hasPdf){
    await new Promise(res=>setTimeout(res,1000));
    r=await call(model,false);
  }
  if(!r.ok&&(r.status===404||r.status>=500)){
    const cands=await aiGetCandidates();
    for(const alt of cands){
      if(alt===model) continue;
      await new Promise(res=>setTimeout(res,1000));

      const isNum=/(calculate|find|compute|determine|evaluate|solve|design|derive|impedance|voltage|current|transfer function|fourier|bode)\b/i.test(text);

function aiMakeProposal(data,target){
  const out=[];
  data.forEach(d=>{
    const m=target||S.subjects.find(s=>s.name.trim()&&sameSubject(s.name,d.name));
    let e=out.find(x=>m?x.sid===m.id:(!x.sid&&sameSubject(x.name,d.name)));
    if(!e){e={name:m?m.name:(d.name||'Imported subject'),sid:m?m.id:null,kind:d.kind,topics:[],qs:[]};out.push(e)}
    const haveT=m?m.topics.map(x=>x.trim()).filter(Boolean):[],haveQ=m?(m.questions||[]):[];
    d.topics.forEach(t=>{if(e.topics.some(x=>sameTopic(x.t,t))) return;const dup=haveT.some(h=>sameTopic(h,t));e.topics.push({t,dup,on:!dup})});
    d.questions.forEach(q=>{if(e.qs.some(x=>sameTopic(x.q.text,q.text))) return;const dup=haveQ.some(h=>sameTopic(h.text,q.text));e.qs.push({t:q.text,q,dup,on:!dup})});

function aiFriendly(e){
  const c=e&&e.code,s=e&&e.status,m=(e&&e.message)||'';
  if(c==='timeout') return 'The request took too long. Try again, or use a smaller file.';
  if(c==='network') return 'Could not reach Google. Check your connection. Inside Claude\'s preview this page is not allowed to call outside servers, so use "Try with Claude" there. The Gemini key works in the Android app.';
  if(c==='http'){
    if(s===400&&/api key/i.test(m)) return 'Google rejected this key. Check that you copied all of it.';
    if(s===400) return 'Google could not read this request. Try a clearer photo or a smaller file.';
    if(s===401||s===403) return 'This key cannot be used, or is blocked in your region. Check that your key is valid in Google AI Studio.';
    if(s===404) return 'No supported Gemini model was found for this key. Check in Google AI Studio that your key is enabled for the Gemini API.';
    if(s===413) return 'The files are too large. Use fewer or smaller files.';
    if(s===429) return 'You have reached the free limit for now. Wait a minute and try again, or use fewer files.';
    if(s>=500) return m?('Google error ('+s+'): '+m):'Google had a problem. Try again in a moment.';
    return 'Google returned an error ('+s+').';
  }
  if(c==='blocked') return 'Google declined to read these files.';
  if(c==='empty') return 'The AI returned nothing. Try a clearer photo.';
  if(c==='parse'||c==='invalid_json') return 'The AI answer could not be understood. Try again, or use a clearer photo.';
  if(c==='pdf') return 'The Claude preview reads photos only. Use a Gemini key for PDFs.';
  if(c==='filetype') return m;
  if(c==='rate_limited') return 'Too many requests right now. Wait a bit and try again.';
  if(c==='image_rejected') return 'One of the images could not be used. Try a different photo.';
  if(c==='nosample'||c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'||c==='images_unavailable') return 'Claude is not available here for reading images.';
  return 'Something went wrong while reading the files. Try again.';
}

const extType=f=>{if(f.type) return f.type;const m=(f.name||'').toLowerCase().match(/\.(jpe?g|png|webp|heic|heif|pdf)$/);return m?({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',pdf:'application/pdf'})[m[1]]:''};

function viewToday(){

    '<div class="panel"><h3>Deadlines</h3><div class="stack" style="gap:12px;margin-top:10px">'+(dl_.length?dl_.map(x=>{const p=taskProgress(x,P),pc=Math.round(p/Math.max(1,x.totalMin)*100),dd=x.due?E.diffDays(t,x.due):null;

  h+='<div class="panel"><h3>Your data</h3><div class="row" style="margin-top:12px">'+
    '<button class="btn" data-act="replan">Re-plan from today</button><button class="btn ghost" data-act="sample">'+(confirmKey==='sample'?'Tap again to replace':'Load the example')+'</button><button class="btn ghost" data-act="clearall">'+(confirmKey==='clear'?'Tap again to erase':'Erase everything')+'</button></div>'+
    '<p class="small muted" style="margin-top:10px">Re-plan keeps topics you ticked as covered and the time you already spent on tasks, then rebuilds the days from today.</p></div></div>';
  return h;
}

/* ---- Guide ---- */
function viewGuide(){
  return '<div class="hero" style="margin-bottom:10px"><h2>Guide</h2></div><div class="panel"><h3>Why the plan looks like this</h3><div class="stack" style="gap:10px;margin-top:12px;max-width:68ch">'+
   '<p><strong>Test yourself instead of re-reading.</strong> A large review of study methods rated practice testing and spaced practice as high utility, and re-reading and highlighting as low. Every block in the plan ends with you recalling or solving something closed book.</p>'+
   '<p><strong>Come back to each topic.</strong> New topics return after 1, 3, 7 and 14 days. The review block lists exactly which ones are due.</p>'+
   '<p><strong>Mix problem types.</strong> In an introductory physics course, students who practised shuffled problems did better on surprise problem-solving exams than students who practised one topic at a time. The practice phase shuffles subjects for the same reason. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8589969/" target="_blank" rel="noopener">Read the study</a>.</p>'+
   '<p><strong>Cramming does not last.</strong> Spreading 8 hours over 8 days beats 8 hours in one night for anything you need to remember afterwards. Sleep is scheduled, not optional.</p></div></div>'+
   '<h3 style="margin:22px 0 10px">How to do each task</h3>'+GUIDE_ORDER.map(k=>{const g=GUIDE[k];return '<details class="g"><summary>'+esc(g.t)+'</summary><div class="bd"><ol>'+g.s.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div></details>'}).join('');
}

/* ---- render + events ---- */
function fabHTML(){
  return '<button class="fab" data-act="ai-jump" aria-label="Import syllabus with AI" title="Import syllabus with AI">'+
    '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'+
  '</button>';
}
function render(){
  const y=window.scrollY,ae=document.activeElement;
  const fk=ae&&ae.dataset&&ae.dataset.chg?{c:ae.dataset.chg,r:ae.dataset.rid}:null;
  let body;
  try{body=route==='plan'?viewPlan():route==='tasks'?viewTasks():route==='setup'?viewSetup():route==='guide'?viewGuide():viewToday()}
  catch(e){console.error(e);body='<div class="notice bad" style="margin-top:20px">This view could not be drawn: '+esc(e.message)+'. Try Setup, then check your dates.</div>'}
  $app.innerHTML=header()+'<main>'+body+'</main>'+fabHTML();
  window.scrollTo(0,y);
  if(fk){const el=$app.querySelector('[data-chg="'+fk.c+'"][data-rid="'+(window.CSS&&CSS.escape?CSS.escape(fk.r):fk.r)+'"]');if(el) el.focus({preventScroll:true})}
}
function replan(){
  const P=getPlan();if(P.empty) return;
  P.days.forEach(d=>d.rows.concat(d.out).forEach(r=>{
    if(!S.done[r.id]) return;
    if(r.cov) r.cov.forEach(c=>{S.coveredBase[c.s+'|'+c.t]=d.date});
    if(r.task&&r.kind==='task') S.taskDone[r.task]=(S.taskDone[r.task]||0)+r.dur;
  }));
  const t=todayISO();if(t>S.settings.startDate) S.settings.startDate=t;
  viewDate=null;touch();render();toast('Plan rebuilt from today');
}
function planText(P){
  const L=['EXAM BENCH PLAN','Plan: '+E.fmtDate(P.days[0].date)+' to '+E.fmtDate(P.end)+'. First exam: '+E.fmtDate(P.firstExam)+'.',''];
  P.days.forEach(d=>{
    L.push('DAY '+(d.i+1)+'  '+E.fmtDate(d.date)+'  ['+(PHASE[d.phase]||'Rest day')+']'+(d.exams.length?'  EXAM: '+d.exams.join(', '):''));
    dayRows(d).forEach(r=>{L.push('  '+E.fmtTime(r.start)+'  '+r.dur+' min  '+r.title+(r.out?'  (own slot)':''));(r.sub||[]).forEach(x=>L.push('        - '+(x.m?x.m+' ':'')+x.text))});
    L.push('');
  });
  return L.join('\n');
}
function setBind(el){
  const b=el.dataset.bind;
  if(b==='set'){const f=el.dataset.f;S.settings[f]=(f==='breakMin'||f==='bufferDay')?+el.value:el.value}
  else if(b==='hour'){S.settings.hours[+el.dataset.i]=Math.max(0,parseFloat(el.value)||0)}
  else if(b==='subj'){
    const s=S.subjects.find(x=>x.id===el.dataset.sid);if(!s) return;const f=el.dataset.f;
    if(f==='pastPapers') s.pastPapers=el.checked;
    else if(f==='topics'){s.topics=el.value.split('\n');const c=document.getElementById('cnt-'+s.id);if(c) c.textContent='('+s.topics.map(x=>x.trim()).filter(Boolean).length+')'}
    else if(f==='weight') s.weight=+el.value;
    else s[f]=el.value;
  }
  S.sample=false;touch();
}
$app.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&(el.dataset.f==='topics'||el.dataset.f==='name')) setBind(el)});
$app.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset) return;
  if(el.dataset.chg&&el.dataset.chg.indexOf('ai')===0){aiChange(el);return}
  if(el.dataset.chg==='tick'){const id=el.dataset.rid;if(el.checked) S.done[id]=true;else delete S.done[id];touch();render();return}
  if(el.dataset.bind){setBind(el);if(el.dataset.bind==='set'||el.dataset.bind==='hour'||el.dataset.f==='kind') {if(el.dataset.f==='kind') render()}}
});
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const a=b.dataset.act,P=plan;
  if(a.indexOf('ai-')===0){aiAct(a,b);return}
  const needConfirm=k=>{if(confirmKey!==k){confirmKey=k;render();setTimeout(()=>{if(confirmKey===k){confirmKey=null;render()}},4000);return true}confirmKey=null;return false};
  if(a==='day'){const p=getPlan();const nd=E.addDays(viewDate,+b.dataset.v);if(nd>=p.days[0].date&&nd<=p.days[p.days.length-1].date){viewDate=nd;render();window.scrollTo(0,0)}}
  else if(a==='jump'){viewDate=null;render();window.scrollTo(0,0)}
  else if(a==='open'){viewDate=b.dataset.date;if(route==='today'){render()}else location.hash='today'}
  else if(a==='how'){const id=b.dataset.rid;openHow[id]=!openHow[id];render()}
  else if(a==='replan') replan();
  else if(a==='startblank'){const keep=S.settings;S=makeBlank();S.settings=Object.assign(S.settings,{hours:keep.hours,startTime:keep.startTime,lightsOut:keep.lightsOut,breakMin:keep.breakMin,bufferDay:keep.bufferDay});touch();location.hash='setup';render();toast('Add your subjects below')}
  else if(a==='sample'){if(needConfirm('sample')) return;S=makeSample();S.sample=false;viewDate=null;touch();render();toast('Example loaded')}
  else if(a==='clearq'){if(needConfirm('cq'+b.dataset.sid)) return;const s=S.subjects.find(x=>x.id===b.dataset.sid);if(s){s.questions=[];S.sample=false;touch();render();toast('Questions cleared')}}
  else if(a==='clearall'){if(needConfirm('clear')) return;S=makeBlank();viewDate=null;touch();render();toast('Everything erased')}
  else if(a==='addsub'){S.subjects.push({id:uid(),name:'',kind:'theory',rating:'okay',weight:2,pastPapers:false,examDate:'',topics:[]});S.sample=false;touch();render()}
  else if(a==='delsub'){if(needConfirm('ds'+b.dataset.sid)) return;S.subjects=S.subjects.filter(x=>x.id!==b.dataset.sid);S.tasks.forEach(t=>{if(t.subjectId===b.dataset.sid) t.subjectId=''});touch();render()}
  else if(a==='up'||a==='down'){const i=subjIdx(b.dataset.sid),j=a==='up'?i-1:i+1;if(i>=0&&j>=0&&j<S.subjects.length){const x=S.subjects[i];S.subjects[i]=S.subjects[j];S.subjects[j]=x;touch();render()}}
  else if(a==='rate'){const s=S.subjects.find(x=>x.id===b.dataset.sid);if(s){s.rating=b.dataset.v;S.sample=false;touch();render()}}
  else if(a==='addtask'){editTask={id:uid(),title:'',type:'assignment',subjectId:'',totalMin:60,chunkMin:60,due:'',mode:'hybrid',slot:'17:00'};render()}
  else if(a==='edittask'){const t=S.tasks.find(x=>x.id===b.dataset.tid);if(t){editTask=Object.assign({},t);render()}}
  else if(a==='canceltask'){editTask=null;render()}
  else if(a==='deltask'){if(needConfirm('dt'+b.dataset.tid)) return;S.tasks=S.tasks.filter(x=>x.id!==b.dataset.tid);touch();render()}
  else if(a==='savetask'){
    const v=id=>document.getElementById(id).value,title=v('tk-title').trim(),items=+v('tk-items')||0,per=+v('tk-per')||0,hours=parseFloat(v('tk-hours'))||0;
    const total=items>0&&per>0?items*per:Math.round(hours*60);
    if(!title){toast('Give the task a name');return}
    if(total<=0){toast('Enter total hours, or items and minutes per item');return}
    const t={id:b.dataset.tid,title,type:v('tk-type'),subjectId:v('tk-subj'),totalMin:total,chunkMin:Math.max(10,+v('tk-chunk')||60),due:v('tk-due'),mode:v('tk-mode'),slot:v('tk-slot')||'17:00',items:items>0&&per>0?items:0,perItem:items>0&&per>0?per:0};
    const i=S.tasks.findIndex(x=>x.id===t.id);if(i>=0) S.tasks[i]=t;else S.tasks.push(t);
    S.sample=false;editTask=null;touch();render();toast('Task saved');
  }
  else if(a==='download'&&dl){
    const p=getPlan();if(p.empty) return;
    dl.save({filename:'exam-bench-plan.txt',data:planText(p)}).then(()=>toast('Plan saved'),err=>{if(!err||err.code!=='declined') toast('Saving a file is not available here')});
  }
});
function routeFromHash(){const h=location.hash.replace('#','');return ROUTES.indexOf(h)>=0?h:'today'}
window.addEventListener('hashchange',()=>{route=routeFromHash();confirmKey=null;render();window.scrollTo(0,0)});

S=loadLocal()||makeSample();
route=routeFromHash();
render();
initCaps();
</script>
