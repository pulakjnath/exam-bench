<title>Exam Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: lab-bench notebook. Graph-paper ground, top tab strip (bottom bar on phones), a timeline column plus a side column. Subjects wear resistor colour bands. */
:root{
  --bg:#EDF1F3; --paper:#F8FAFB; --ink:#12212C; --ink2:#4A5B67; --line:#CFD9DF; --grid:#DCE4E9;
  --accent:#D9482B; --accent-ink:#FFFFFF; --accent-soft:#F8E1DB;
  --ok:#2F7D4F; --warn:#9A6411; --bad:#B3321F;
  --ph-cover:#3F72B8; --ph-practice:#7C5BB0; --ph-exam:#C8412F; --ph-buffer:#4C9A5B;
  --c0:#8A5A3B; --c1:#C8412F; --c2:#E0832B; --c3:#C9A21C; --c4:#4C9A5B; --c5:#3F72B8; --c6:#7C5BB0; --c7:#7C8791; --c8:#2A9D9A; --c9:#C8559A;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1319; --paper:#111D25; --ink:#E3ECF1; --ink2:#93A5B1; --line:#26363F; --grid:#14232C;
  --accent:#FF8A5C; --accent-ink:#1A0D07; --accent-soft:#33201A;
  --ok:#6CC58B; --warn:#E3B25A; --bad:#FF7D68;
  --ph-cover:#6FA1E0; --ph-practice:#A98BDD; --ph-exam:#FF7D68; --ph-buffer:#6CC58B;
  --c0:#C08A67; --c1:#FF7D68; --c2:#F2A04E; --c3:#E3C44A; --c4:#6CC58B; --c5:#6FA1E0; --c6:#A98BDD; --c7:#9AA8B2; --c8:#4FC9C5; --c9:#E889C0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1319; --paper:#111D25; --ink:#E3ECF1; --ink2:#93A5B1; --line:#26363F; --grid:#14232C;
  --accent:#FF8A5C; --accent-ink:#1A0D07; --accent-soft:#33201A;
  --ok:#6CC58B; --warn:#E3B25A; --bad:#FF7D68;
  --ph-cover:#6FA1E0; --ph-practice:#A98BDD; --ph-exam:#FF7D68; --ph-buffer:#6CC58B;
  --c0:#C08A67; --c1:#FF7D68; --c2:#F2A04E; --c3:#E3C44A; --c4:#6CC58B; --c5:#6FA1E0; --c6:#A98BDD; --c7:#9AA8B2; --c8:#4FC9C5; --c9:#E889C0;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:.01em;text-wrap:balance;line-height:1.05}
h2{font-size:1.9rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar + nav */
.top{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font:800 1.6rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.bands{display:inline-flex;gap:3px;height:20px;align-items:stretch}
.bands i{display:block;width:5px;border-radius:1px}
.bands i:nth-child(1){background:var(--c0)} .bands i:nth-child(2){background:var(--c2)} .bands i:nth-child(3){background:var(--c5)} .bands i:nth-child(4){background:var(--c3);margin-left:5px}
.grow{flex:1}
.savestate{font:500 .75rem var(--font-mono);color:var(--ink2)}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink)}
nav.tabs a{padding:9px 16px;text-decoration:none;color:var(--ink2);font-weight:600;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;display:flex;align-items:center;gap:8px}
nav.tabs a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper);border-color:var(--ink)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--ink);border-bottom:0;justify-content:space-around;
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:column;gap:2px;padding:6px 8px;font-size:.72rem;border:0;margin:0;flex:1;align-items:center;min-width:0}
  nav.tabs a[aria-current="page"]{background:transparent;color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
}

/* panels + controls */
.panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:16px}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.btn{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:7px 14px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--font-mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 7px;border:1.5px solid var(--line);border-radius:3px;white-space:nowrap}
.chip.ph-cover{color:var(--ph-cover);border-color:var(--ph-cover)}
.chip.ph-practice{color:var(--ph-practice);border-color:var(--ph-practice)}
.chip.ph-exam{color:var(--ph-exam);border-color:var(--ph-exam)}
.chip.ph-buffer{color:var(--ph-buffer);border-color:var(--ph-buffer)}
.band{display:inline-block;width:10px;height:16px;border-radius:1px;vertical-align:-3px;margin-right:6px;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.in,select.in,textarea.in{background:var(--bg);border:1.5px solid var(--line);border-radius:3px;padding:7px 9px;color:var(--ink);width:100%;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{min-height:120px;resize:vertical;font-family:var(--font-body)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notice{border:1.5px solid var(--warn);background:var(--paper);padding:10px 14px;border-radius:3px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.info{border-color:var(--ph-cover)}
.notice.bad{border-color:var(--bad)}
.notice .grow{min-width:200px}

/* Today */
.hero{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 12px}
.daynum{font:800 clamp(3.2rem,11vw,5.4rem)/.85 var(--font-display);letter-spacing:.01em}
.daynum small{font-size:.35em;color:var(--ink2);letter-spacing:.05em;margin-left:8px}
.dayrail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(6px,1fr);gap:2px;margin:6px 0 0}
.dayrail i{height:14px;background:var(--line);display:block;border-radius:1px;position:relative}
.dayrail i.ph-cover{background:var(--ph-cover)} .dayrail i.ph-practice{background:var(--ph-practice)} .dayrail i.ph-exam{background:var(--ph-exam)} .dayrail i.ph-buffer{background:var(--ph-buffer)}
.dayrail i.past{opacity:.35}
.dayrail i.cur{outline:2px solid var(--ink);outline-offset:1px;opacity:1;z-index:1}
.dayrail i.ex::after{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:var(--bad)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:0 10px;padding:0 0 14px;position:relative}
.tl .t{font:600 .78rem/1.5 var(--font-mono);text-align:right;padding-top:12px;color:var(--ink2)}
.tl .rail{position:relative}
.tl .rail::before{content:"";position:absolute;left:8px;top:0;bottom:-14px;width:2px;background:var(--line)}
.tl li:last-child .rail::before{bottom:14px}
.tl .dot{position:absolute;left:3px;top:14px;width:12px;height:12px;border:2px solid var(--ink);background:var(--paper);border-radius:2px;z-index:1}
.tl .card{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;min-width:0}
.tl li.brk .card{background:transparent;border:1.5px dashed var(--line);padding:6px 12px}
.tl li.brk .dot{border-color:var(--line);border-radius:50%}
.tl li.done .card{opacity:.6}
.tl li.done .ttl{text-decoration:line-through;text-decoration-thickness:1px}
.tl li.out .card{border-style:dashed}
.tl .head{display:flex;gap:10px;align-items:flex-start}
.tl .ttl{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.tl .dur{font:600 .75rem var(--font-mono);color:var(--ink2);white-space:nowrap;padding-top:3px}
.tl .detail{margin-top:4px;color:var(--ink2);font-size:.9rem;overflow-wrap:anywhere}
.tl ul.sub{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.tl ul.sub li{display:grid;grid-template-columns:minmax(26px,max-content) minmax(0,1fr);gap:8px;padding:0;font-size:.88rem}
.tl ul.sub li .m{font:600 .75rem var(--font-mono);color:var(--accent);padding-top:2px}
.tl .acts{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.how{margin-top:8px;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.88rem}
.how ol{margin:4px 0 0;padding-left:18px}
.prog{height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent)}
.prog.ok b{background:var(--ok)}
@media (max-width:760px){.tl li{grid-template-columns:48px 14px minmax(0,1fr);gap:0 6px}.tl .t{font-size:.7rem}}

/* Plan */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cal button{background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:5px 4px 6px;cursor:pointer;text-align:left;min-width:0;display:flex;flex-direction:column;gap:3px}
.cal button:hover{border-color:var(--ink)}
.cal button.cur{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.cal .d{font:600 .7rem var(--font-mono);color:var(--ink2)}
.cal .n{font:800 1.15rem/1 var(--font-display)}
.cal .pb{height:4px;border-radius:1px;background:var(--line)}
.cal .ph-cover .pb{background:var(--ph-cover)} .cal .ph-practice .pb{background:var(--ph-practice)} .cal .ph-exam .pb{background:var(--ph-exam)} .cal .ph-buffer .pb{background:var(--ph-buffer)}
.cal .fl{font:600 .62rem var(--font-mono);color:var(--bad);min-height:.9em}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:560px}
table.t th{font:600 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.05em;text-align:left;color:var(--ink2);padding:6px 8px;border-bottom:1.5px solid var(--ink)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--accent-soft)}
.bar{display:flex;height:14px;background:var(--line);border-radius:1px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--lc);border-radius:1px}

/* forms */
.subj{border:1.5px solid var(--ink);background:var(--paper);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px}
.subj .hd{display:flex;gap:10px;align-items:center}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hours label{display:flex;flex-direction:column;gap:3px;font:600 .72rem var(--font-mono);color:var(--ink2);text-align:center}
.hours input{text-align:center;padding:6px 2px}
details.g{border:1.5px solid var(--line);border-radius:3px;background:var(--paper)}
details.g+details.g{margin-top:8px}
details.g summary{cursor:pointer;padding:10px 12px;font-weight:700}
details.g .bd{padding:0 12px 12px;color:var(--ink2)}
details.g ol{margin:6px 0 0;padding-left:20px}
.empty{padding:28px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:4px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.tl .card,.btn{transition:background .15s,opacity .15s}}
</style>
<div class="wrap" id="app"></div>
